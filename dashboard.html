<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WEBMAIL TRACKER Dashboard</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --blue: #1d4ed8;
            --blue-soft: #dbeafe;
            --green: #1f9d61;
            --orange: #f59e0b;
            --red: #dc2626;
            --red-soft: #fee2e2;
            --text: #1f2937;
            --muted: #6b7280;
            --line: #e5e7eb;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px 22px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
        }

        .title-block h1 {
            margin: 0;
            font-size: 1.9rem;
        }

        .title-block small {
            color: var(--muted);
        }

        .selector-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        label {
            font-size: 0.9rem;
            color: var(--muted);
        }

        select {
            min-width: 220px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: white;
            font-size: 0.95rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px 16px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.03);
        }

        .card h3 {
            margin: 0 0 10px;
            font-size: 0.85rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .card .value {
            font-size: 1.9rem;
            font-weight: 700;
            margin: 0;
        }

        .card.red {
            background: linear-gradient(135deg, var(--red-soft), #fff);
            border-color: #fecaca;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.03);
        }

        .panel h2 {
            margin: 0 0 16px;
            font-size: 1.1rem;
        }

        .bars {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bar-row {
            display: grid;
            grid-template-columns: 150px 1fr 48px;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
        }

        .bar-label {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text);
        }

        .bar-track {
            position: relative;
            background: #eef2ff;
            height: 16px;
            border-radius: 12px;
            overflow: hidden;
        }

        .bar-fill {
            position: absolute;
            inset: 0 auto 0 0;
            border-radius: 12px;
            background: linear-gradient(90deg, var(--blue), #60a5fa);
        }

        .bar-fill.red {
            background: linear-gradient(90deg, var(--red), #fca5a5);
        }

        .bar-value {
            text-align: right;
            font-weight: 600;
            color: var(--muted);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #f9fafb;
            font-size: 0.8rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        tr.red-row {
            background: #fff5f5;
        }

        .flag {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            background: var(--red-soft);
            color: var(--red);
        }

        .muted {
            color: var(--muted);
            font-size: 0.88rem;
        }

        @media (max-width: 720px) {
            .bar-row {
                grid-template-columns: 110px 1fr 36px;
            }
            .topbar {
                display: block;
            }
            .selector-wrap {
                margin-top: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <div class="title-block">
                <h1>WEBMAIL TRACKER</h1>
                <small id="lastUpdated">Last updated: --</small>
            </div>
            <div class="selector-wrap">
                <label for="officialFilter">Filter by official</label>
                <select id="officialFilter">
                    <option value="All">All officials</option>
                </select>
            </div>
        </div>

        <div class="stats" id="statsCards"></div>

        <div class="chart-grid">
            <div class="panel">
                <h2>Pending by Official</h2>
                <div class="bars" id="officialChart"></div>
            </div>
            <div class="panel">
                <h2>Pendency Age Band</h2>
                <div class="bars" id="ageChart"></div>
            </div>
        </div>

        <div class="panel">
            <h2>Pending Cases</h2>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>SL No.</th>
                            <th>Date of Receipt</th>
                            <th>From whom</th>
                            <th>Subject</th>
                            <th>Official</th>
                            <th>Status</th>
                            <th>Age (days)</th>
                            <th>Flag</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const statsCards = document.getElementById('statsCards');
        const officialFilter = document.getElementById('officialFilter');
        const officialChart = document.getElementById('officialChart');
        const ageChart = document.getElementById('ageChart');
        const tableBody = document.getElementById('tableBody');
        const lastUpdated = document.getElementById('lastUpdated');

        function formatDays(days) {
            return Number(days || 0) + ' days';
        }

        function renderCards(summary) {
            const avgAge = Number(summary.avg_age_days || 0);
            const cards = [
                { title: 'Total pending', value: summary.total_pending ?? 0 },
                { title: 'Red flag (>7 days)', value: summary.red_flag_count ?? 0, className: 'red' },
                { title: 'Officials', value: summary.official_count ?? 0 },
                { title: 'Average age', value: `${avgAge}d` }
            ];

            statsCards.innerHTML = cards.map(card => `
                <div class="card ${card.className || ''}">
                    <h3>${card.title}</h3>
                    <p class="value">${card.value}</p>
                </div>
            `).join('');
        }

        function renderBarChart(container, data, redMode = false) {
            const maxValue = Math.max(...data.map(x => x.value), 1);
            container.innerHTML = data.map(item => {
                const pct = (item.value / maxValue) * 100;
                return `
                    <div class="bar-row">
                        <div class="bar-label">${item.label}</div>
                        <div class="bar-track">
                            <div class="bar-fill ${redMode ? 'red' : ''}" style="width:${pct}%"></div>
                        </div>
                        <div class="bar-value">${item.value}</div>
                    </div>
                `;
            }).join('');
        }

        function prepareAgeBands(rows) {
            const buckets = [
                { label: '0-3', value: 0 },
                { label: '4-7', value: 0 },
                { label: '8-15', value: 0 },
                { label: '16+', value: 0 }
            ];

            rows.forEach(row => {
                const age = Number(row.age_days || 0);
                if (age <= 3) buckets[0].value += 1;
                else if (age <= 7) buckets[1].value += 1;
                else if (age <= 15) buckets[2].value += 1;
                else buckets[3].value += 1;
            });
            return buckets;
        }

        function renderTable(rows) {
            if (!rows.length) {
                tableBody.innerHTML = '<tr><td colspan="8" class="muted">No matching cases found for this official.</td></tr>';
                return;
            }

            tableBody.innerHTML = rows.map(row => `
                <tr class="${row.red_flag ? 'red-row' : ''}">
                    <td>${row.serial_no || '-'}</td>
                    <td>${row.date_of_receipt || '-'}</td>
                    <td>${row.from_whom_received || '-'}</td>
                    <td>${row.subject || '-'}</td>
                    <td>${row.official || 'Unassigned'}</td>
                    <td>${row.remarks_status || '-'}</td>
                    <td>${formatDays(row.age_days)}</td>
                    <td>${row.red_flag ? '<span class="flag">RED FLAG</span>' : 'OK'}</td>
                </tr>
            `).join('');
        }

        function renderFilter(officials) {
            const selected = officialFilter.value || 'All';
            const fixedList = ['Sunil', 'Vipin', 'Hemraj', 'Anil', 'Rajeev', 'On file', 'Miscellaneous'];
            const itemMap = new Map((officials || []).map(item => [item.name, item.count]));
            const finalOptions = fixedList.map(name => ({
                name,
                count: itemMap.get(name) || 0
            }));

            officialFilter.innerHTML = ['<option value="All">All officials</option>']
                .concat(finalOptions.map(item => `<option value="${item.name}">${item.name} (${item.count})</option>`))
                .join('');
            officialFilter.value = selected;
        }

        async function loadDashboard() {
            try {
                const response = await fetch('data/latest.json?t=' + Date.now());
                if (!response.ok) {
                    throw new Error('Dataset file not found. Please run the scraper first.');
                }
                const data = await response.json();

                lastUpdated.textContent = 'Last updated: ' + (data.fetched_at || 'unknown');
                renderCards(data.summary || {});

                const approvedOfficials = data.officials || [];
                renderFilter(approvedOfficials);

                const selectedOfficial = officialFilter.value || 'All';
                const allRows = (data.rows || []).slice().sort((a, b) => {
                    const dateA = new Date(a.date_of_receipt_iso || '1970-01-01');
                    const dateB = new Date(b.date_of_receipt_iso || '1970-01-01');
                    return dateB - dateA;
                });

                const normalizedRows = allRows.map(row => ({
                    ...row,
                    official: row.official === 'Unassigned' || !row.official ? 'Miscellaneous' : row.official
                }));

                const filteredRows = selectedOfficial === 'All'
                    ? normalizedRows
                    : normalizedRows.filter(row => (row.official || 'Miscellaneous') === selectedOfficial);

                const countsByOfficial = {};
                normalizedRows.forEach(row => {
                    const name = row.official || 'Miscellaneous';
                    countsByOfficial[name] = (countsByOfficial[name] || 0) + 1;
                });

                const officialData = Object.entries(countsByOfficial).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([label, value]) => ({ label, value }));
                renderBarChart(officialChart, officialData, true);

                const ageData = prepareAgeBands(filteredRows.length ? filteredRows : (data.rows || []));
                renderBarChart(ageChart, ageData, false);
                renderTable(filteredRows);

            } catch (error) {
                console.error(error);
                lastUpdated.textContent = 'Last updated: data unavailable';
                statsCards.innerHTML = '<div class="card red"><h3>Warning</h3><p class="value">Unable to load data</p></div>';
                officialChart.innerHTML = '<div class="muted">No chart data available.</div>';
                ageChart.innerHTML = '<div class="muted">No chart data available.</div>';
                tableBody.innerHTML = '<tr><td colspan="8" class="muted">The dashboard could not load the latest Google Sheet data. Run the scraper and refresh the page.</td></tr>';
            }
        }

        officialFilter.addEventListener('change', loadDashboard);
        loadDashboard();
    </script>
</body>
</html>
